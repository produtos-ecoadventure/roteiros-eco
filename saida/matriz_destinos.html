<style>
/* Layout: catálogo em três níveis (famílias → roteiros → detalhe), uma coisa por vez. Só as cores do manual Eco + neutros. */
:root {
  --navy: #2a3767;        /* azul Eco */
  --green: #53af02;       /* verde Eco */
  --green-ink: #3a7d00;
  --green-soft: #eef7e6;
  --navy-soft: #eef0f6;
  --bg: #f7f8fa;
  --surface: #ffffff;
  --ink: #1f2747;
  --muted: #687089;
  --line: #e6e8ef;
  --on-navy: #ffffff;
  --sea: #eef4f8;
  --land: #ffffff;
  --land-line: #cdd6e2;
  --font-brand: "Josefin Sans", "Century Gothic", Arial, sans-serif;
  --font-display: "Quicksand", "Century Gothic", Arial, sans-serif;
  --font-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --navy: #b3bee9; --green: #6cc81f; --green-ink: #8fd94f; --green-soft: #1d2f12; --navy-soft: #232a45;
  --bg: #121626; --surface: #1a1f33; --ink: #e8eaf3; --muted: #9aa1b8; --line: #2b3250; --on-navy: #121626;
  --sea: #141a2c; --land: #1f2640; --land-line: #3a4366; color-scheme: dark; } }
:root[data-theme="dark"] {
  --navy: #b3bee9; --green: #6cc81f; --green-ink: #8fd94f; --green-soft: #1d2f12; --navy-soft: #232a45;
  --bg: #121626; --surface: #1a1f33; --ink: #e8eaf3; --muted: #9aa1b8; --line: #2b3250; --on-navy: #121626;
  --sea: #141a2c; --land: #1f2640; --land-line: #3a4366; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1080px; margin: 0 auto; }
a { color: inherit; }

header { padding-block: 36px 8px; }
.brand { font-family: var(--font-brand); font-weight: 600; letter-spacing: .22em; text-transform: uppercase; font-size: .74rem; color: var(--navy); display: flex; align-items: center; gap: 10px; margin: 0 0 18px; text-decoration: none; width: fit-content; }
.brand b { font-family: var(--font-display); font-weight: 700; letter-spacing: 0; text-transform: lowercase; font-size: 1.45rem; line-height: 1; }
.brand b span:first-child { color: var(--green); }
.top { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
h1 { font-family: var(--font-display); font-weight: 700; color: var(--navy); font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.search { position: relative; flex: 0 1 380px; min-width: 0; width: 100%; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search input { font: inherit; width: 100%; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 12px 18px 12px 44px; }
.search input:focus { border-color: var(--green); outline: none; box-shadow: 0 0 0 3px var(--green-soft); }

main { padding-block: 28px 64px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); margin-bottom: 14px; }
.crumbs a { color: var(--muted); text-decoration: none; font-weight: 600; }
.crumbs a:hover { color: var(--navy); }
h2 { font-family: var(--font-display); font-weight: 700; color: var(--navy); font-size: clamp(1.5rem, 3vw, 2rem); margin: 0; line-height: 1.15; text-wrap: balance; }
.intro { color: var(--muted); margin: 6px 0 26px; max-width: 62ch; }

/* Nível 1: famílias */
.fams { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.fam { display: grid; gap: 6px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; text-decoration: none; transition: border-color .15s, transform .15s; }
.fam:hover { border-color: var(--green); transform: translateY(-2px); }
.fam h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--navy); }
.fam p { margin: 0; color: var(--muted); font-size: .92rem; }
.fam .meta { margin-top: 6px; font-size: .82rem; font-weight: 700; color: var(--green-ink); }

/* Nível 2: lista de roteiros */
.list { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; text-decoration: none; transition: border-color .15s; }
.row:hover { border-color: var(--green); }
.row h3 { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--ink); }
.row .days { font-size: .88rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.row .path { grid-column: 1 / -1; color: var(--muted); font-size: .92rem; }
.row .path b { color: var(--navy); font-weight: 700; }
.row .why { grid-column: 1 / -1; font-size: .84rem; font-weight: 700; color: var(--green-ink); }
.tag { display: inline-block; font-size: .64rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); background: var(--navy-soft); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: 2px; }

/* Nível 3: detalhe */
.detail { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.meta2 { color: var(--muted); font-weight: 600; margin: 6px 0 22px; }
.mapbox { background: var(--sea); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: auto; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { position: relative; padding: 0 0 18px 30px; }
.steps li::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: -8px; width: 2px; background: var(--line); }
.steps li:last-child::before { display: none; }
.steps li::after { content: ""; position: absolute; left: 1px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--green); }
.steps li.zero::after { background: var(--surface); border: 2px solid var(--navy); box-sizing: border-box; }
.steps b { display: block; font-weight: 800; }
.steps span { color: var(--muted); font-size: .9rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 800; font-size: .92rem; text-decoration: none; border-radius: 999px; padding: 10px 18px; border: 0; cursor: pointer; }
.btn.primary { background: var(--green); color: #fff; }
.btn.ghost { background: var(--navy-soft); color: var(--navy); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; border-top: 1px solid var(--line); padding-top: 18px; }
.pager a { text-decoration: none; color: var(--navy); font-weight: 700; font-size: .95rem; max-width: 48%; }
.pager a small { display: block; color: var(--muted); font-weight: 600; font-size: .78rem; }
.pager a.next { text-align: right; margin-left: auto; }
.mapnote { color: var(--muted); font-size: .8rem; margin: 8px 2px 0; }

svg.map .land { fill: var(--land); stroke: var(--land-line); }
svg.map .uf { fill: var(--muted); opacity: .4; font-family: var(--font-brand); font-weight: 600; letter-spacing: .2em; }
svg.map .path { fill: none; stroke: var(--green); stroke-linecap: round; stroke-linejoin: round; }
svg.map .path-bg { fill: none; stroke: var(--land); stroke-linecap: round; stroke-linejoin: round; }
svg.map .stop { fill: var(--green); stroke: var(--land); }
svg.map .stop.z { fill: var(--land); stroke: var(--navy); }
svg.map .lbl { font-family: var(--font-body); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-linejoin: round; }
svg.map .num { font-family: var(--font-body); font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central; }

/* Comparar */
.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: auto; max-height: 78vh; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; border-bottom: 1px solid var(--line); vertical-align: bottom; padding: 0 1px; }
th.corner { left: 0; z-index: 3; }
.vh { writing-mode: vertical-rl; transform: rotate(180deg); font-size: .8rem; font-weight: 700; color: var(--navy); padding: 10px 0; height: 140px; width: 32px; text-align: left; white-space: nowrap; }
tbody th { position: sticky; left: 0; background: var(--surface); text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--line); min-width: 200px; font-weight: 700; font-size: .92rem; }
tbody th a { text-decoration: none; }
tbody td { text-align: center; border-bottom: 1px solid var(--line); padding: 4px 1px; font-weight: 800; font-size: .86rem; color: var(--green-ink); }
tbody td.z { color: var(--muted); font-weight: 600; }
tr.f td { position: sticky; left: 0; background: var(--bg); text-align: left; padding: 10px 16px 6px; font-family: var(--font-display); font-weight: 700; color: var(--navy); font-size: .95rem; }

.empty { padding: 28px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
footer { border-top: 1px solid var(--line); padding-block: 22px 40px; color: var(--muted); font-size: .86rem; }
footer .inner { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
footer a { color: var(--navy); font-weight: 700; text-decoration: none; }
a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
@media (max-width: 820px) { .detail { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const short = d => d.replace(/\/[A-Z]{2}$/, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nt = n => n ? `${n} noite${n > 1 ? "s" : ""}` : "sem pernoite";
const fi = f => D.familias.indexOf(f);
D.roteiros.forEach(r => { r.map = {}; r.t.forEach(([d, n]) => { r.map[d] = (r.map[d] ?? 0) + n; }); r.slug = slug(r.n); });
D.roteiros.sort((a, b) => fi(a.f) - fi(b.f) || a.d - b.d || a.n.localeCompare(b.n));
const byFam = {}; D.roteiros.forEach(r => (byFam[r.f] = byFam[r.f] || []).push(r));
const DEST = D.regioes.flatMap(g => g.destinos);

/* ---------- Mapa esquemático ---------- */
const GEO = {

const K = 100, LON0 = -45.2, LAT0 = -1.8;
const P = ([lat, lon]) => [(lon - LON0) * K, (-lat + LAT0) * K];
const COAST = [[-1.8,-45.2],[-1.95,-44.9],[-2.25,-44.7],[-2.6,-44.45],[-2.45,-44.33],[-2.3,-44.15],[-2.38,-43.8],[-2.43,-43.4],[-2.47,-43.0],[-2.52,-42.72],[-2.68,-42.35],[-2.82,-41.95],[-2.86,-41.6],[-2.87,-41.2],[-2.86,-40.85],[-2.77,-40.55],[-2.8,-40.3],[-3.0,-39.85],[-3.2,-39.35],[-3.45,-38.95],[-3.7,-38.5],[-4.1,-38.1],[-4.5,-37.7],[-4.85,-37.2],[-4.95,-36.8],[-5.05,-36.3],[-5.08,-35.9],[-5.1,-35.55],[-5.4,-35.25],[-5.8,-35.18],[-6.5,-34.95],[-7.2,-34.8],[-8.1,-34.88],[-9.0,-35.15],[-9.7,-35.6]];
const LAND = (() => {
  const pts = COAST.map(P), f = pts[0], l = pts[pts.length - 1];
  return "M" + [[-3000, f[1]], ...pts, [l[0], 4000], [-3000, 4000]].map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" L") + " Z";
})();
const UFS = [["MA", -4.6, -44.3], ["PI", -6.6, -42.4], ["CE", -5.1, -39.7], ["RN", -5.85, -36.8], ["PE", -8.4, -38.6]];

function mapSvg(r) {
  const seq = [];
  r.t.forEach(([d]) => { if (GEO[d] && (!seq.length || seq[seq.length - 1] !== d)) seq.push(d); });
  const xy = seq.map(d => P(GEO[d]));
  const pad = 80, ratio = 1.5;
  let x0 = Math.min(...xy.map(p => p[0])) - pad, x1 = Math.max(...xy.map(p => p[0])) + pad;
  let y0 = Math.min(...xy.map(p => p[1])) - pad, y1 = Math.max(...xy.map(p => p[1])) + pad;
  let w = Math.max(x1 - x0, 420), h = y1 - y0;
  if (w / h < ratio) w = h * ratio; else h = w / ratio;
  const vx = (x0 + x1) / 2 - w / 2, vy = (y0 + y1) / 2 - h / 2, s = w / 760;
  const nights = {}; r.t.forEach(([d, n]) => nights[d] = (nights[d] || 0) + n);
  const line = xy.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ");
  const boxes = [], hit = b => boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
  const rad = d => (nights[d] ? 12 : 7) * s;
  [...new Set(seq)].forEach(d => { const [cx, cy] = P(GEO[d]); boxes.push([cx - rad(d), cy - rad(d), cx + rad(d), cy + rad(d)]); });
  let g = `<svg class="map" viewBox="${vx.toFixed(0)} ${vy.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}" role="img" aria-label="Mapa do trajeto: ${esc(seq.map(short).join(", "))}">`;
  g += `<rect x="${vx}" y="${vy}" width="${w}" height="${h}" fill="var(--sea)"/><path class="land" d="${LAND}" stroke-width="${1.2 * s}"/>`;
  UFS.forEach(([u, la, lo]) => { const [x, y] = P([la, lo]); g += `<text class="uf" x="${x}" y="${y}" font-size="${15 * s}">${u}</text>`; });
  g += `<polyline class="path-bg" points="${line}" stroke-width="${8 * s}"/><polyline class="path" points="${line}" stroke-width="${3.2 * s}"/>`;
  let lbls = "";
  [...new Set(seq)].forEach(d => {
    const [cx, cy] = P(GEO[d]), n = nights[d], r0 = rad(d);
    g += `<circle class="stop${n ? "" : " z"}" cx="${cx}" cy="${cy}" r="${r0}" stroke-width="${2.4 * s}"><title>${esc(short(d))}: ${nt(n)}</title></circle>`;
    if (n) g += `<text class="num" x="${cx}" y="${cy}" font-size="${12 * s}">${n}</text>`;
    const fs = 14 * s, tw = short(d).length * fs * .56, th = fs * 1.1, gap = r0 + 5 * s;
    for (const [x, y] of [[cx + gap, cy - gap * .5], [cx + gap, cy + gap + th * .5], [cx - gap - tw, cy - gap * .5], [cx - gap - tw, cy + gap + th * .5], [cx - tw / 2, cy - gap - 2 * s], [cx - tw / 2, cy + gap + th]]) {
      const b = [x, y - th * .85, x + tw, y + th * .2];
      if (!hit(b)) { boxes.push(b); lbls += `<text class="lbl" x="${x}" y="${y}" font-size="${fs}" stroke-width="${4 * s}">${esc(short(d))}</text>`; break; }
    }
  });
  return g + lbls + "</svg>";
}

/* ---------- Telas ---------- */
const pathText = (r, hl) => {
  const seen = new Set();
  return r.t.filter(([d]) => !seen.has(d) && seen.add(d)).map(([d, n, o]) => {
    let t = esc(short(d));
    if (hl && hl(d)) t = `<b>${t}</b>`;
    return !n && /bate-volta/.test(o || "") ? `(${t})` : t;
  }).join(" → ");
};
const rowHtml = (r, why, hl) => `<a class="row" href="#r-${r.slug}"><h3>${esc(r.n)}${r.cat !== "Light" ? `<span class="tag">${esc(r.cat)}</span>` : ""}</h3>` +
  `<span class="days">${r.d} dias · ${r.nt} noites</span><span class="path">${pathText(r, hl)}</span>${why ? `<span class="why">${why}</span>` : ""}</a>`;

function home() {
  return `<h2>Famílias de roteiros</h2><p class="intro">Comece por aqui: cada família reúne roteiros com a mesma proposta. Escolha uma para ver os roteiros e, depois, o trajeto de cada um.</p>` +
    `<div class="fams">` + D.familias.filter(f => byFam[f]).map(f => {
      const rs = byFam[f], ds = rs.map(r => r.d), mn = Math.min(...ds), mx = Math.max(...ds);
      return `<a class="fam" href="#f-${slug(f)}"><h3>${esc(f)}</h3><p>${esc(SOBRE[f] || "")}</p>` +
        `<span class="meta">${rs.length} roteiro${rs.length > 1 ? "s" : ""} · ${mn === mx ? mn : mn + " a " + mx} dias</span></a>`;
    }).join("") + `</div>`;
}

function family(f) {

    `<div class="list">${rs.map(r => rowHtml(r)).join("")}</div>`;
}

function roteiro(r) {
  const rs = byFam[r.f], i = rs.indexOf(r), prev = rs[i - 1], next = rs[i + 1];
  const steps = r.t.map(([d, n, o]) => `<li class="${n ? "" : "zero"}"><b>${esc(short(d))}</b><span>${nt(n)}${o ? " · " + esc(o) : ""}</span></li>`).join("");
  return `<nav class="crumbs"><a href="#inicio">Famílias</a> / <a href="#f-${slug(r.f)}">${esc(r.f)}</a> /</nav>` +
    `<h2>${esc(r.n)}${r.cat !== "Light" ? `<span class="tag">${esc(r.cat)}</span>` : ""}</h2><p class="meta2">${r.d} dias e ${r.nt} noites</p>` +
    `<div class="detail"><div><div class="mapbox">${mapSvg(r)}</div><p class="mapnote">Mapa esquemático. No círculo verde, o número de noites; o círculo vazado é passagem sem pernoite.</p></div>` +
    `<div><ol class="steps">${steps}</ol><div class="actions"><a class="btn primary" href="https://drive.google.com/file/d/${encodeURIComponent(r.pdf)}/view" target="_blank" rel="noopener">Abrir PDF do roteiro ↗</a></div></div></div>` +
    `<nav class="pager">${prev ? `<a href="#r-${prev.slug}"><small>← Anterior</small>${esc(prev.n)}</a>` : ""}${next ? `<a class="next" href="#r-${next.slug}"><small>Próximo →</small>${esc(next.n)}</a>` : ""}</nav>`;
}

function results(q) {
  const nq = norm(q.trim());
  const dests = DEST.filter(d => norm(short(d)).includes(nq));
  const hits = [];
  D.roteiros.forEach(r => {
    if (norm(r.n).includes(nq) || norm(r.f).includes(nq)) hits.push([r, ""]);
    else { const d = dests.find(x => x in r.map); if (d) hits.push([r, `Passa por ${short(d)}: ${nt(r.map[d])}`]); }
  });
  const hl = d => dests.includes(d);
  return `<nav class="crumbs"><a href="#inicio">Famílias</a> /</nav><h2>Resultados para “${esc(q.trim())}”</h2>` +
    `<p class="intro">${hits.length} roteiro${hits.length === 1 ? "" : "s"} encontrado${hits.length === 1 ? "" : "s"}.</p>` +
    (hits.length ? `<div class="list">${hits.map(([r, why]) => rowHtml(r, why, hl)).join("")}</div>` : `<div class="empty">Nada encontrado. Tente o nome de um roteiro (ex.: Essencial) ou de um destino (ex.: Jericoacoara).</div>`);
}

function compare() {
  const cols = DEST;
  let h = `<nav class="crumbs"><a href="#inicio">Famílias</a> /</nav><h2>Comparar todos os roteiros</h2><p class="intro">Noites em cada destino; “·” indica passagem sem pernoite.</p>` +
    `<div class="tablewrap"><table><thead><tr><th class="corner"></th>${cols.map(d => `<th><div class="vh">${esc(short(d))}</div></th>`).join("")}</tr></thead><tbody>`;
  D.familias.filter(f => byFam[f]).forEach(f => {
    h += `<tr class="f"><td colspan="${cols.length + 1}">${esc(f)}</td></tr>`;
    byFam[f].forEach(r => {
      h += `<tr><th><a href="#r-${r.slug}">${esc(r.n)}</a></th>` + cols.map(d => !(d in r.map) ? "<td></td>" : r.map[d] ? `<td>${r.map[d]}</td>` : `<td class="z">·</td>`).join("") + "</tr>";
    });
  });
  return h + "</tbody></table></div>";
}

function route() {
  const q = $("q").value;
  const hsh = location.hash.slice(1);
  let html;
  if (q.trim()) html = results(q);
  else if (hsh.startsWith("f-")) { const f = D.familias.find(x => slug(x) === hsh.slice(2)); html = f && byFam[f] ? family(f) : home(); }
  else if (hsh.startsWith("r-")) { const r = D.roteiros.find(x => x.slug === hsh.slice(2)); html = r ? roteiro(r) : home(); }
  else if (hsh === "comparar") html = compare();
  else html = home();
  $("view").innerHTML = html;
}
window.addEventListener("hashchange", () => { $("q").value = ""; route(); window.scrollTo({ top: 0 }); });
$("q").addEventListener("input", route);
route();
</script>
